<title>Leftover Clock PRD</title>
<style>
:root {

  --line: #d9d4c7; --accent: #c2410c; --accent-soft: #fde7d9;
  --now: #15803d; --later: #b45309; --cut: #8b8f97; --open: #b91c1c;
  --node: #ffffff; --node-line: #b9b2a3;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1e2125; --ink: #e8e6e1; --muted: #a2a8b2;
    --line: #353a41; --accent: #fb923c; --accent-soft: #3a2416;
    --now: #4ade80; --later: #fbbf24; --cut: #7d838c; --open: #f87171;
    --node: #23272c; --node-line: #4a5059;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1e2125; --ink: #e8e6e1; --muted: #a2a8b2;
  --line: #353a41; --accent: #fb923c; --accent-soft: #3a2416;
  --now: #4ade80; --later: #fbbf24; --cut: #7d838c; --open: #f87171;
  --node: #23272c; --node-line: #4a5059;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.6 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
}
html[lang="ko"] body { word-break: keep-all; }
[hidden] { display: none !important; }
#lang-toggle {
  position: fixed; top: 12px; right: 16px; z-index: 10;
  font: 600 14px system-ui, "Malgun Gothic", sans-serif; color: var(--ink);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 6px 14px; cursor: pointer;
}
#lang-toggle:hover { border-color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; }
.status {
  display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 10px;
}
h1 { font-size: 34px; line-height: 1.15; margin: 12px 0 8px; }
.lede { font-size: 18px; color: var(--muted); margin: 0 0 28px; }
h2 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 40px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.expand { border-left: 4px solid var(--accent); }
.expand p { margin: 0 0 8px; }
.expand p:last-child { margin: 0; }
.expand .was { color: var(--muted); }
svg { width: 100%; height: auto; display: block; }
svg .box { fill: var(--node); stroke: var(--node-line); stroke-width: 1.5; }
svg .side .box { stroke-dasharray: 4 3; }
svg .node { cursor: pointer; }
svg .node:hover .box, svg .node:focus .box { stroke: var(--accent); }
svg .node.on .box { stroke: var(--accent); stroke-width: 3; fill: var(--accent-soft); }
svg .t { fill: var(--ink); font: 600 14px system-ui, "Malgun Gothic", sans-serif; }
svg .s { fill: var(--muted); font: 12px system-ui, "Malgun Gothic", sans-serif; }
svg .n { fill: var(--accent); font: 700 12px system-ui, sans-serif; }
svg .arrow { stroke: var(--muted); stroke-width: 1.5; fill: none; marker-end: url(#ah); }
svg .arrow.fix { stroke: var(--accent); stroke-dasharray: 5 4; marker-end: url(#ahf); }
svg #ah path { fill: var(--muted); } svg #ahf path { fill: var(--accent); }
.caption { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.stepper { margin-top: 14px; }
.stepnav { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.stepnav button {
  font: 600 14px system-ui, "Malgun Gothic", sans-serif; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer;
}
.stepnav button:hover:not(:disabled) { border-color: var(--accent); }
.stepnav button:disabled { opacity: .4; cursor: default; }
.dots { display: flex; gap: 6px; margin-left: auto; }
.dots span { width: 9px; height: 9px; border-radius: 50%; background: var(--line); cursor: pointer; }
.dots span.on { background: var(--accent); }
.step h3 { margin: 0 0 2px; font-size: 20px; }
.step .src { font-size: 13px; color: var(--muted); margin: 0 0 12px; }
.step h4 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.step ul { margin: 0; padding-left: 20px; }
.step li { margin: 3px 0; }
.step .assume { color: var(--later); font-weight: 600; }
.step .openq { color: var(--open); font-weight: 600; }
ul.ac { list-style: none; padding-left: 0; }
ul.ac label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
ul.ac input { margin-top: 5px; accent-color: var(--now); }
ul.ac input:checked + span { color: var(--muted); text-decoration: line-through; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .grid { grid-template-columns: 1fr; } h1 { font-size: 28px; } }
.grid .card h3 { margin: 0 0 6px; font-size: 15px; }
.grid .card p { margin: 0; }
details { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 10px; }
summary { cursor: pointer; padding: 14px 18px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 10px; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; margin-left: auto; color: var(--muted); font-weight: 400; font-size: 20px; }
details[open] summary::after { content: "–"; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.count { color: var(--muted); font-weight: 400; font-size: 14px; }
details ul { margin: 0; padding: 0 18px 16px 40px; }
details li { margin: 4px 0; }
details li em { color: var(--muted); font-style: normal; }
.oq { display: flex; gap: 10px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--line); }
.oq:first-child { border-top: 0; padding-top: 0; }
.oq:last-child { padding-bottom: 0; }
.tag { flex: none; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; border: 1px solid; white-space: nowrap; }
.tag.block { color: var(--open); border-color: var(--open); }
.tag.wait { color: var(--muted); border-color: var(--line); }
.feedback p { margin: 0 0 8px; } .feedback p:last-child { margin: 0; }
footer { margin-top: 40px; font-size: 13px; color: var(--muted); }
</style>
</head>

</main>

// node index -> step index; positions [x, y, side]
var POS = [[20,110],[260,110],[500,110],[500,230],[260,230],[20,230],[260,350],[20,10,1],[20,350,1]];
var NODE_STEP = [0,1,2,3,4,5,6,7,7];
var lang = 'en', cur = 0;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

function drawDiagram() {
  var L = T[lang], W = 200, H = 64, out = [];
  out.push('<svg viewBox="0 0 720 430" role="img" aria-label="' + esc(L.h_journey) + '">');
  out.push('<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker>' +
           '<marker id="ahf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z"/></marker></defs>');
  var arrows = ['M220 142H256','M460 142H496','M600 174V226','M500 262H464','M260 262H224','M360 294V346','M120 110V78','M120 294V346'];
  arrows.forEach(function (d) { out.push('<path class="arrow" d="' + d + '"/>'); });
  out.push('<path class="arrow fix" d="M170 230C170 200 300 200 330 226"/>');
  POS.forEach(function (p, i) {
    var cls = 'node' + (p[2] ? ' side' : '') + (NODE_STEP[i] === cur ? ' on' : '');
    var num = i < 7 ? (i + 1) + '' : '8';
    out.push('<g class="' + cls + '" tabindex="0" role="button" data-step="' + NODE_STEP[i] + '">' +
      '<rect class="box" x="' + p[0] + '" y="' + p[1] + '" width="' + W + '" height="' + H + '" rx="14"/>' +
      '<text class="n" x="' + (p[0] + 12) + '" y="' + (p[1] + 24) + '">' + num + '</text>' +
      '<text class="t" x="' + (p[0] + 28) + '" y="' + (p[1] + 25) + '">' + esc(L.nodes[i][0]) + '</text>' +
      '<text class="s" x="' + (p[0] + 28) + '" y="' + (p[1] + 46) + '">' + esc(L.nodes[i][1]) + '</text></g>');
  });
  out.push('</svg>');
  var box = document.getElementById('diagram');
  box.innerHTML = out.join('');
  box.querySelectorAll('.node').forEach(function (g) {
    var go = function () { show(+g.getAttribute('data-step')); };
    g.addEventListener('click', go);
    g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
}

function list(items, checkable) {
  if (!items.length) return '';
  return (checkable ? '<ul class="ac">' : '<ul>') + items.map(function (it) {
    if (typeof it === 'object') {
      return it.a ? '<li class="assume">' + esc(it.a) + '</li>' : '<li class="openq">' + esc(it.o) + '</li>';
    }
    return checkable ? '<li><label><input type="checkbox"><span>' + esc(it) + '</span></label></li>' : '<li>' + esc(it) + '</li>';
  }).join('') + '</ul>';
}

function show(i) {
  var L = T[lang], s = L.steps[i];
  cur = i;
  document.getElementById('step').innerHTML =
    '<h3>' + esc(s.h) + '</h3><p class="src">' + esc(s.src) + '</p>' +
    '<h4>' + L.see + '</h4>' + list(s.see) +
    '<h4>' + L.doo + '</h4>' + list(s.doo) +
    (s.states.length ? '<h4>' + L.states + '</h4>' + list(s.states) : '') +
    '<h4>' + L.ac + '</h4>' + list(s.ac, true);
  document.getElementById('prev').disabled = i === 0;
  document.getElementById('next').disabled = i === L.steps.length - 1;
  document.querySelectorAll('#dots span').forEach(function (d, k) { d.className = k === i ? 'on' : ''; });
  document.querySelectorAll('#diagram .node').forEach(function (g) {
    g.classList.toggle('on', +g.getAttribute('data-step') === i);
  });
}

function render() {
  var L = T[lang];
  document.documentElement.lang = lang;
  document.title = L.title;
  document.getElementById('lang-toggle').textContent = L.toggle;
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = L[el.getAttribute('data-t')]; });
  document.getElementById('prev').textContent = L.prev;
  document.getElementById('next').textContent = L.next;
  document.getElementById('expand').innerHTML = L.expand.map(function (e) {
    return '<p class="was">' + esc(e[0]) + '</p><p>' + esc(e[1]) + '</p>';
  }).join('');
  document.getElementById('dots').innerHTML = L.steps.map(function () { return '<span></span>'; }).join('');
  document.querySelectorAll('#dots span').forEach(function (d, k) { d.addEventListener('click', function () { show(k); }); });
  document.getElementById('look').innerHTML = L.look.map(function (c) {
    return '<div class="card"><h3>' + esc(c[0]) + '</h3><p>' + esc(c[1]) + '</p></div>';
  }).join('');
  document.getElementById('boundary').innerHTML = L.groups.map(function (g, k) {
    return '<details' + (k === 0 ? ' open' : '') + '><summary><span class="dot" style="background:' + g.color + '"></span>' +
      esc(g.name) + ' <span class="count">' + g.items.length + '</span></summary><ul>' +
      g.items.map(function (it) { return '<li>' + it + '</li>'; }).join('') + '</ul></details>';
  }).join('');
  document.getElementById('decisions').innerHTML = L.decisions.map(function (d) { return '<li>' + esc(d) + '</li>'; }).join('');
  document.getElementById('open').innerHTML = L.open.map(function (o) {
    return '<div class="oq"><span class="tag ' + o[0] + '">' + esc(o[1]) + '</span><span>' + esc(o[2]) + '</span></div>';
  }).join('');
  document.getElementById('feedback').innerHTML = L.feedback.map(function (p) { return '<p>' + esc(p) + '</p>'; }).join('');
  drawDiagram();
  show(cur);
  try { localStorage.setItem('prd-lang', lang); } catch (e) {}
}

document.getElementById('prev').addEventListener('click', function () { if (cur > 0) show(cur - 1); });
document.getElementById('next').addEventListener('click', function () { if (cur < T[lang].steps.length - 1) show(cur + 1); });
document.getElementById('lang-toggle').addEventListener('click', function () { lang = lang === 'ko' ? 'en' : 'ko'; render(); });
try { lang = localStorage.getItem('prd-lang') || 'en'; } catch (e) {}
if (!T[lang]) lang = 'en';
render();
</script>
